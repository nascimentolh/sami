[package]
name = "maestro"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alacritty_terminal = "=0.26.0"
futures = "0.3"
# o mesmo do gpui (sem download novo): só para o ícone da janela no X11
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = "=0.7.0"
# a mesma do gpui-base: os providers do editor recebem esses tipos
lsp-types = "=0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

# ponytail: corrige o pânico do XIM com tecla morta no ibus (texto Latin-1 sem escape); sai quando o upstream corrigir
[patch.crates-io]
xim-ctext = { path = "vendor/xim-ctext" }
