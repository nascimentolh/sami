<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Maestro IDE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* layout: janela de app desktop; lateral Features | terminal herdr (centro, protagonista) | painel de revisão sob demanda.
   Um mundo só: o app inteiro herda a paleta Dracula do ~/.config/ghostty/config. */
:root{
  --page:#16171d; --win:#282a36; --panel:#21222c; --raise:#313342; --line:#3b3d50; --fg:#f8f8f2; --muted:#9a9dbb; --comment:#6272a4;
  --accent:#bd93f9; --accent-soft:rgba(189,147,249,.16); --ok:#50fa7b; --cyan:#8be9fd; --orange:#ffb86c; --pink:#ff79c6; --yellow:#f1fa8c; --bad:#ff5555;
  --add:rgba(80,250,123,.10); --del:rgba(255,85,85,.12); --draft:#f1fa8c; --draft-soft:rgba(241,250,140,.07);
  --term-bg:rgba(40,42,54,.95);
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrainsMono Nerd Font","JetBrainsMono NF","JetBrains Mono",ui-monospace,monospace;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font:13px/1.45 var(--sans);box-sizing:border-box;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
kbd{font:11px var(--mono);padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--panel);white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

.app{height:100%;max-width:1480px;margin:0 auto;display:grid;grid-template-rows:36px 32px 1fr 22px 24px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.title{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.brand{font-weight:600;letter-spacing:.02em}
.modes{display:flex;gap:2px;margin-left:8px}
.wtabs{display:flex;align-items:stretch;gap:2px;padding:4px 8px 0;background:#191a21;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;min-width:0}
.wtabs .wt{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-radius:6px 6px 0 0;color:var(--muted);font-size:12.5px;max-width:280px;min-width:0}
.wtabs .wt .lb{overflow:hidden;text-overflow:ellipsis}
.wtabs .wt .rp{color:var(--fg)}
.wtabs .wt .br{font-family:var(--mono);font-size:11.5px;color:var(--comment)}
.wtabs .wt[aria-selected="true"]{background:var(--panel);color:var(--fg)}
.wtabs .wt[aria-selected="true"] .br{color:var(--purple,#bd93f9)}
.wtabs .wt:hover:not([aria-selected="true"]){background:#21222c}
.wtabs .wt .k{font-family:var(--mono);font-size:10.5px;color:var(--comment)}
.wtabs .wt .x{color:var(--comment);padding:0 2px;border-radius:3px}.wtabs .wt .x:hover{color:var(--fg);background:#343746}
.wtabs .wt .att{color:var(--orange);font-weight:700}
.term>.hbar{display:none}
.wtabs .sp{flex:1}
.wtabs .r{padding:0 10px;color:var(--comment);font-size:12px;font-family:var(--mono)}.wtabs .r:hover{color:var(--fg)}
.wtabs .nt{padding:0 10px;color:var(--comment);font-size:14px}.wtabs .nt:hover{color:var(--fg)}
.modes button{padding:3px 10px;border-radius:5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.modes button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.modes .count{font:11px var(--mono);color:var(--orange)}
.title .sp{flex:1}
.title .hint{color:var(--muted);display:flex;gap:10px;align-items:center;white-space:nowrap}
.title .hint button{display:flex;gap:6px;align-items:center}
.tag{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;white-space:nowrap}

.main{--lw:250px;--rw:0px;display:grid;min-height:0;position:relative;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-areas:"left center right"}
.main[data-right="on"]{--rw:min(46%,640px)}
.main[data-left="off"]{--lw:0px}
#left{grid-area:left;border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;display:flex;flex-direction:column}
.main[data-left="off"] #left{display:none}
#center{grid-area:center;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
#right:focus-within{box-shadow:inset 0 2px 0 var(--accent)}
#right{grid-area:right;border-left:1px solid var(--line);background:var(--win);display:flex;flex-direction:column;min-height:0;min-width:0}
.main[data-right="off"] #right{display:none}
.rz{position:absolute;top:0;bottom:0;width:4px;cursor:col-resize;z-index:6}
.rz:hover,.rz.drag{background:var(--accent-soft)}
#rzL{left:calc(var(--lw) - 2px)} #rzR{right:calc(var(--rw) - 2px)}
.main[data-left="off"] #rzL,.main[data-right="off"] #rzR{display:none}
.drawer>.rz{left:-2px}
body.resizing{cursor:col-resize;user-select:none}
.rtabs .t .cx{margin-left:6px;color:var(--muted);border-radius:3px;padding:0 3px}
.rtabs .t .cx:hover{background:var(--line);color:var(--fg)}
.rtabs .t .cx.dirty{color:var(--accent)}

.phead{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
.phead .sp{flex:1}
.phead button{text-transform:none;letter-spacing:0;font-size:12px}

/* features */
.repo{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font-weight:500}
.repo .mono{font-size:12px;color:var(--muted);font-weight:400}
.feats{display:grid;padding:2px 6px 6px;gap:2px}
.feat{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 8px;padding:6px 8px;border-radius:6px;text-align:left;align-items:center;position:relative}
.feat:hover{background:var(--raise)}
.feat.on{background:var(--accent-soft)}
.feat .g{font:12px var(--mono);text-align:center}
.feat .b{font:12.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .k{font-size:11px;color:var(--muted)}
.feat .rmx{visibility:hidden;margin-left:4px;padding:0 2px;border-radius:3px;color:var(--comment);font-size:12px}.feat:hover .rmx{visibility:visible}.feat .rmx:hover{color:var(--fg);background:#343746}
.feat .m{grid-column:2/4;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .m.blocked{color:var(--orange)}.feat .m.done{color:var(--ok)}
.feat.unseen::after{content:"";position:absolute;left:2px;top:8px;bottom:8px;width:2px;border-radius:2px;background:currentColor;animation:pulse 1.2s infinite}
.feat.unseen.blocked{color:var(--orange)}.feat.unseen.done{color:var(--ok)}
.feat.unseen .b{color:var(--fg)}
.st-blocked{color:var(--orange)}.st-working{color:var(--cyan)}.st-done{color:var(--ok)}.st-idle{color:var(--comment)}
.st-working.spin{display:inline-block;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.newf{margin:2px 6px 8px;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.newf:hover{color:var(--fg);border-color:var(--accent)}
.ltabs{display:flex;gap:2px;padding:6px 8px 0;border-top:1px solid var(--line)}
.ltabs button{padding:4px 8px;border-radius:5px 5px 0 0;color:var(--muted);font-size:12px}
.ltabs button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.flist{padding:4px 0 10px}
.flist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;width:100%;text-align:left;padding:3px 12px;align-items:center}
.flist button:hover{background:var(--raise)}
.flist button.on{background:var(--accent-soft)}
.flist .nm{font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .nm .dir{color:var(--muted)}
.flist .st{font:11px var(--mono);color:var(--muted)}
.flist .st.d{color:var(--draft)}
.flist .none{padding:6px 12px;color:var(--muted);font-size:12px}
.rrepos{display:flex;gap:2px;padding:4px 6px 0;background:#191a21;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;flex:none}
.rrepos::-webkit-scrollbar{display:none}
.rrepos{scrollbar-width:none}
.rrepos button{padding:4px 10px;border-radius:5px 5px 0 0;font:12px var(--mono);color:var(--muted)}
.rrepos button[aria-selected="true"]{background:var(--panel);color:var(--fg)}
.flist .fname{padding:2px 8px}
.flist .fname input{width:100%;background:var(--win);border:1px solid var(--accent);border-radius:4px;color:var(--fg);font:12px var(--mono);padding:2px 6px;outline:none}
.fmenu{position:fixed;z-index:60;min-width:160px;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:4px;display:grid}
.fmenu button{text-align:left;padding:4px 10px;border-radius:4px;font-size:12px;color:var(--fg)}
.fmenu button:hover{background:var(--accent-soft)}
.fmenu button.danger{color:var(--bad)}
.fmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.fmenu button{display:flex;gap:16px;justify-content:space-between;align-items:center}
.fmenu button kbd{border:0;background:none;padding:0;color:var(--comment)}
.fmenu button.off{opacity:.45;cursor:default}.fmenu button.off:hover{background:none}
.flist button.sel{box-shadow:inset 2px 0 0 var(--accent)}
.flist button.cut .nm{opacity:.5}
.flist button.drop,.flist.drop{background:var(--accent-soft)}
.flist .fsearch{padding:4px 8px 6px}
.flist .fsearch input{width:100%;background:var(--win);border:1px solid var(--line);border-radius:4px;color:var(--fg);font:12px var(--mono);padding:3px 6px;outline:none}
.flist .fsearch input:focus{border-color:var(--accent)}
.flist button.hit{grid-template-columns:1fr;gap:0}
.flist .ht{font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.flist .ht mark{background:rgba(241,250,140,.25);color:var(--fg);border-radius:2px}
.edwrap .goto{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:9;width:260px;background:var(--raise);border:1px solid var(--accent);border-radius:6px;box-shadow:var(--shadow);padding:6px}
.edwrap .goto input{width:100%;background:var(--win);border:1px solid var(--line);border-radius:4px;color:var(--fg);font:13px var(--mono);padding:4px 8px;outline:none}

/* terminal (herdr dentro, visual Ghostty) */
/* valores do ~/.config/ghostty/config + defaults do Ghostty: cursor block, unfocused-split-opacity 0.7 */
.term{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--term-bg);font:13px/1.32 var(--mono);font-feature-settings:"calt" 1,"liga" 1;color:#f8f8f2}
.term ::selection{background:#44475a;color:#ffffff}
.hbar{display:flex;align-items:center;gap:0;background:#21222c;border-bottom:1px solid #191a21;font-size:12px;flex:none;overflow-x:auto;white-space:nowrap}
.hbar button{padding:3px 12px;color:var(--comment)}
.hbar button.on{color:#f8f8f2;background:#282a36}
.hbar .sp{flex:1}
.hbar .r{padding:3px 10px;color:var(--comment)}
.hbar .r.pre{color:#282a36;background:var(--yellow);font-weight:700}
.panes{flex:1;display:grid;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.panes.v{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panes.h{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.panes.v .pane+.pane{border-left:1px solid #44475a}
.panes.h .pane+.pane{border-top:1px solid #44475a}
.pane.unf::after{content:"";position:absolute;inset:0;background:rgba(40,42,54,.3);pointer-events:none}
.tbody{flex:1;overflow:auto;padding:8px;white-space:pre-wrap;word-break:break-word}
.tbody b{font-weight:700}
.w{color:#ffffff}.cy{color:#8be9fd}.mg{color:#ff79c6}.rd{color:#ff5555}.gr{color:#50fa7b}.or{color:#ff8700}.bl{color:#bd93f9}.yl{color:#f1fa8c}.cm{color:#6272a4}
.pass{background:#50fa7b;color:#282a36;font-weight:700}
.live{display:block}
.sin{background:transparent;border:0;outline:none;color:#f8f8f2;font:inherit;width:70%;caret-color:#f8f8f2;caret-shape:block;padding:0}
.tbody .u{background:rgba(68,71,90,.55);padding:2px 6px;margin:6px 0;border-left:2px solid var(--comment)}
.tbody .dot{color:var(--ok)}
.tbody .dotw{color:var(--fg)}
.tbody .out{color:var(--comment)}
.tbody .dim{color:var(--comment)}
.tbody .okc{color:var(--ok)}
.tbody .warn{color:var(--orange)}
.tbody .think{color:var(--orange)}
.tbody .ps{color:var(--ok)}
.cc{border:1px solid var(--orange);border-radius:4px;padding:6px 10px;color:var(--orange);margin-bottom:8px;display:grid}
.cc .w{color:var(--fg)}
.perm{border:1px solid var(--orange);border-radius:4px;padding:8px 12px;margin:8px 0;display:grid;gap:2px}
.perm .h{color:var(--orange);font-weight:700}
.perm .cmd{padding-left:2px;color:var(--fg)}
.perm .out{color:var(--comment)}
.perm button{text-align:left;padding:1px 0;color:var(--muted);font:inherit}
.perm button.on{color:var(--accent)}
.perm button:hover{color:var(--fg)}
.tin{margin:0 8px 4px;border:1px solid var(--comment);border-radius:4px;display:flex;gap:8px;align-items:center;padding:4px 10px;flex:none}
.tin:focus-within{border-color:var(--muted)}
.tin span{color:var(--fg)}
.tin input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--fg);font:inherit;caret-color:var(--fg);caret-shape:block}
.fsep{padding:8px 14px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.feat.db{padding:4px 8px}.feat.db .g.up{color:var(--ok)}.feat.db .g.off{color:var(--comment)}.feat.db .g.down{color:var(--bad)}.feat.db .g.start{color:var(--yellow)}
.feat.db .k{font:11px var(--mono);color:var(--comment)}.feat.db .prd{font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:3px;padding:0 4px;margin-left:6px}
.tfoot{display:flex;justify-content:space-between;gap:12px;padding:0 10px 6px;color:var(--comment);font-size:11.5px;flex:none;white-space:nowrap;overflow:hidden}

/* painel direito: revisão / editor */
.rtabs{display:flex;align-items:center;height:32px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;overflow-x:auto}
.rtabs button.t{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line)}
.rtabs button.t[aria-pressed="true"]{color:var(--fg);background:var(--win);box-shadow:inset 0 -2px 0 var(--accent)}
.rtabs .sp{flex:1}
.rtabs .x{padding:0 10px;color:var(--muted)}
.ed{flex:1;display:flex;min-height:0;font:13px/20px var(--mono)}
.gut{width:44px;flex:none;text-align:right;padding:10px 10px 10px 0;color:var(--comment);overflow:hidden;user-select:none;white-space:pre}
.edwrap{position:relative;flex:1;min-width:0}
.edwrap pre,.edwrap textarea{position:absolute;inset:0;margin:0;padding:10px 12px 10px 4px;font:inherit;white-space:pre;overflow:auto;tab-size:2;border:0}
.edwrap pre{pointer-events:none;color:var(--fg)}
.edwrap textarea{background:transparent;color:transparent;caret-color:var(--fg);resize:none;outline:none}
.edwrap textarea::selection{background:rgba(68,71,90,.9);color:transparent}
.k{color:var(--pink)}.s{color:var(--yellow)}.c{color:var(--comment);font-style:italic}.n{color:var(--accent)}
.empty{margin:auto;max-width:46ch;text-align:center;color:var(--muted);display:grid;gap:10px;padding:24px}
.empty h3{margin:0;color:var(--fg);font-weight:500;font-size:15px}
.btn{padding:3px 10px;border-radius:5px;border:1px solid var(--line);background:var(--raise);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#282a36;font-weight:500}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

/* diff (usado na revisão local e nos MRs) */
.diff{flex:1;overflow:auto;font:12.5px/20px var(--mono);padding-bottom:40px}
.fh{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-family:var(--sans)}
.fh .p{font-family:var(--mono)}
.fh .sp{flex:1}
.fh .plus{color:var(--ok)}.fh .minus{color:var(--bad)}
.hh{color:var(--comment);background:rgba(98,114,164,.12);padding:0 12px}
.dl{display:grid;grid-template-columns:40px 40px 18px minmax(0,1fr);cursor:pointer;position:relative}
.dl:hover{background:rgba(68,71,90,.45)}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}
.dl.sel{box-shadow:inset 3px 0 0 var(--accent)}
.dl .o,.dl .nn{text-align:right;padding-right:8px;color:var(--comment);user-select:none}
.dl .sg{color:var(--muted);user-select:none}
.dl .cd{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.dl .cm{position:absolute;left:62px;top:2px;width:16px;height:16px;border-radius:3px;background:var(--accent);color:#282a36;font:12px/16px var(--sans);text-align:center;opacity:0}
.dl:hover .cm,.dl.sel .cm{opacity:1}
.thr{margin:6px 12px 6px 94px;max-width:720px;border:1px solid var(--line);border-radius:6px;background:var(--raise);font:13px/1.5 var(--sans)}
.thr.resolved{opacity:.7}
.thr .th{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}
.thr .th b{color:var(--fg);font-weight:500}
.thr .th .sp{flex:1}
.thr .bd{padding:8px 10px;display:grid;gap:8px}
.thr .bd p{margin:0}
.thr .rp{border-left:2px solid var(--line);padding-left:8px}
.thr code{font:12px var(--mono);background:var(--panel);padding:0 3px;border-radius:3px}
.thr.draft{border:1.5px dashed var(--draft);background:var(--draft-soft)}
.thr.draft .th .lbl{color:var(--draft);font-weight:600;letter-spacing:.06em;font-size:11px}
.thr.sent{border:1px solid var(--line);opacity:.7}
.thr.err{border:1.5px solid var(--bad)}
.thr.err .em{color:var(--bad);font-size:12px}
.thr.posting{opacity:.6}
.thr textarea{width:100%;min-height:64px;background:var(--win);border:1px solid var(--line);border-radius:5px;color:var(--fg);font:13px/1.5 var(--sans);padding:6px 8px;resize:vertical}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sev{font:11px var(--mono);padding:0 6px;border-radius:3px;border:1px solid currentColor}
.sev.blocker,.sev.major{color:var(--bad)}.sev.minor{color:var(--orange)}.sev.nit{color:var(--muted)}
.pubbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.pubbar .sp{flex:1}
.pubbar .cnt{color:var(--draft);font-weight:500}

/* inbox / mr */
.ibar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.seg button{padding:3px 10px;border-radius:5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.seg .count{font:11px var(--mono);margin-left:4px}
.ibar input{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--fg);font:inherit;width:200px;max-width:100%}
.ibar .sp{flex:1}
.ibar input[type=checkbox]{width:auto;padding:0}
.list{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:14px minmax(150px,220px) minmax(0,1fr) 120px 70px 110px;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--raise)}
.row.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.row .proj{font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{display:block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ci{font:12px var(--mono);white-space:nowrap}
.ci.success{color:var(--ok)}.ci.running{color:var(--yellow)}.ci.failed{color:var(--bad)}.ci.none{color:var(--muted)}
.pill{font:11px var(--mono);padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);justify-self:start;white-space:nowrap}
.pill.new{color:var(--accent);border-color:var(--accent)}
.pill.inc{color:var(--orange);border-color:var(--orange)}
.mrh{padding:10px 14px 0;border-bottom:1px solid var(--line);display:grid;gap:8px;flex:none}
.mrh .l1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.mrh h2{margin:0;font-size:15px;font-weight:600}
.mrh .l2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-bottom:6px}
.mrh .sp{flex:1}

/* status */
.hints{display:flex;gap:14px;align-items:center;padding:0 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);overflow:hidden;white-space:nowrap}
.status{display:flex;align-items:center;font-size:12px;background:var(--panel);border-top:1px solid var(--line);overflow:hidden;white-space:nowrap}
.status > *{padding:0 10px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;gap:6px}
.status .sp{flex:1;border:0}
.status .att{color:var(--orange)}
.status .drafts{color:var(--draft)}
@keyframes pulse{50%{opacity:.25}}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(10,10,16,.5);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:60px 16px 16px}
.pal{width:560px;max-width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:14px var(--sans);padding:10px 12px;outline:none}
.pal ul{list-style:none;margin:0;padding:4px 0;max-height:340px;overflow:auto}
.pal li{display:flex;gap:10px;padding:6px 12px;cursor:pointer;align-items:center}
.pal li .sp{flex:1}
.pal li.on{background:var(--accent-soft)}
.pal .none{padding:10px 12px;color:var(--muted)}
.dlg{width:480px;max-width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:15px;font-weight:600}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{justify-content:flex-end}
.dlg .fld{display:grid;gap:4px}
.dlg .fld > span{font-size:12px;color:var(--muted)}
.dlg input[type=text],.dlg textarea,.dlg select{background:var(--win);border:1px solid var(--line);border-radius:5px;color:var(--fg);font:13px var(--mono);padding:6px 8px;width:100%}
.dlg textarea{font-family:var(--sans);min-height:64px;resize:vertical}
.dlg .row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.dlg .prev{font:12px var(--mono);color:var(--muted);background:var(--win);border-radius:5px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
.dlg .err{color:var(--bad);font-size:12px}
label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
label.off{opacity:.5;cursor:default}
.help{width:780px;max-width:100%;max-height:calc(100% - 20px);overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:14px}
.help h3{margin:0;font-size:15px}
.help h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.help table{border-collapse:collapse;width:100%;font-size:12.5px}
.help td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.help td:first-child{white-space:nowrap;width:1%;padding-right:16px}
.help .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.help p{margin:0;color:var(--muted)}

.drawer{position:absolute;top:36px;right:0;bottom:46px;width:440px;max-width:100%;background:var(--raise);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:15;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-weight:600}
.drawer .dh .sp{flex:1}
.drawer .db{flex:1;overflow:auto;padding:12px 14px;display:grid;gap:12px;align-content:start}
.drawer .df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.steps{display:grid;gap:4px;font:12.5px/1.5 var(--mono)}
.steps .ok{color:var(--ok)}.steps .run{color:var(--yellow)}.steps .sub{color:var(--muted);padding-left:18px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0;display:grid;gap:6px}
legend{color:var(--muted);font-size:12px;padding:0 4px}
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.find.offd{opacity:.55}
.find .loc{font:12px var(--mono);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find .warnl{color:var(--orange);font-size:12px}
.find p{margin:0;grid-column:2}

/* mascote (sprites de claude-mascot/overlay/poses.py) */
.mascot{position:absolute;right:22px;bottom:58px;z-index:25;display:flex;align-items:flex-end;gap:10px;cursor:pointer;animation:walkin .9s steps(6) both}
.mascot.out{animation:walkout .7s steps(5) both}
.mascot .card{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:260px;box-shadow:var(--shadow);display:grid;gap:2px;margin-bottom:34px}
.mascot .card b{font:12.5px var(--mono)}
.mascot .card span{font-size:12px;color:var(--muted)}
.mascot .card .go{color:var(--accent);font-size:11.5px}
.mascot .body{position:relative;animation:hop .5s ease-in-out infinite alternate}
.mascot .sym{position:absolute;right:-6px;top:-22px;font:700 16px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mascot .sym.ask{background:#6B4FD8}.mascot .sym.done{background:#2BA84A}
.mascot .shadow{width:56px;height:6px;margin:2px auto 0;border-radius:50%;background:rgba(0,0,0,.35)}
@keyframes walkin{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
@keyframes walkout{to{transform:translateX(180px);opacity:0}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-8px)}}

.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;display:grid;gap:8px;z-index:30;max-width:calc(100% - 28px)}
.toast{background:var(--fg);color:var(--win);padding:8px 12px;border-radius:6px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:12.5px}
.toast button{color:var(--win);text-decoration:underline;font-weight:600}

.feat .m2{grid-column:2/4;font:11px var(--mono);color:var(--comment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .m2 .w8{color:var(--orange)}.feat .m2 .ok{color:var(--ok)}.feat .m2 .bad{color:var(--bad)}.feat .m2 .run{color:var(--yellow)}
.feat .grp{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 4px;margin-left:4px}
.rtool{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.rtool select{background:var(--win);border:1px solid var(--line);border-radius:5px;color:var(--fg);font:12px var(--sans);padding:2px 6px;max-width:260px}
.rtool .sp{flex:1}
.hh{display:flex;align-items:center;gap:8px}
.hh .hunkacts{margin-left:auto;display:flex;gap:4px;font-family:var(--sans)}
.hh .hunkacts button{font-size:11.5px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--raise);color:var(--fg)}
.hh .hunkacts button:hover{border-color:var(--muted)}
.hh.okh{color:var(--ok)}
.dl.acc{opacity:.55}
.dl .cd[contenteditable]{outline:none;cursor:text}
.dl .cd[contenteditable]:focus{background:rgba(189,147,249,.10);text-overflow:clip;overflow:auto}
.badge{font:11px var(--mono);padding:0 6px;border-radius:3px;border:1px solid var(--accent);color:var(--accent)}
.card2{border:1px solid var(--line);border-radius:6px;background:var(--raise);padding:10px 12px;display:grid;gap:6px}
.card2 h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center}
.card2 h4 .sp{flex:1}
.card2 p{margin:0}
.okc2{color:var(--ok)}.badc2{color:var(--bad)}.runc2{color:var(--yellow)}
.vmd{font:13px/1.55 var(--sans)}
.vmd h1{font-size:15px;margin:0 0 4px}.vmd h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;font-weight:500}
.vmd ul{margin:0;padding-left:18px}.vmd p{margin:0 0 4px}
.vmd code{font:12px var(--mono);background:var(--panel);padding:0 3px;border-radius:3px}
.vmd .fm{font:11.5px var(--mono);color:var(--comment)}
.wl{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.wl.broken{color:var(--orange)}
.vlog{display:grid;gap:4px;font-size:12px}
.vlog div{display:flex;gap:8px;align-items:center}
.vlog .t{font:11px var(--mono);color:var(--comment)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cmp .col{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px;align-content:start}
.cmp .col b{font:12.5px var(--mono)}
.cmp dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}.cmp dt{color:var(--muted)}.cmp dd{margin:0}
.jira{font-size:12px;color:var(--ok)}
.pal li .pr{font:10px var(--mono);padding:0 5px;border-radius:3px;border:1px solid currentColor}
.pr0{color:var(--orange)}.pr1{color:var(--bad)}.pr2{color:var(--ok)}.pr3{color:var(--accent)}.pr4{color:var(--muted)}
.qbtn{display:flex;gap:6px;align-items:center;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.qbtn b{color:var(--orange);font:11px var(--mono)}
.tour-spot{position:absolute;z-index:40;border-radius:6px;box-shadow:0 0 0 9999px rgba(8,8,14,.62);outline:2px solid var(--accent);pointer-events:none;transition:all .2s}
.tour-pop{position:absolute;z-index:41;width:300px;max-width:calc(100% - 24px);background:var(--raise);border:1px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);padding:12px;display:grid;gap:8px}
.tour-pop p{margin:0}
.tour-pop .acts{justify-content:space-between}
.tour-pop .n{font:11px var(--mono);color:var(--muted)}
.tour-pop .wait{color:var(--accent);font-size:12px}

/* rodada 3: diff lado a lado, colapsar, gerados, respostas, merge */
.fh .vw{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer;margin-left:6px}
.fh .tw{width:16px;color:var(--muted);font:12px var(--mono);text-align:center}
.fh.col{cursor:pointer}
.fh .ask{font:12px var(--mono);padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.fh .ask:hover,.hh .ask:hover{color:var(--fg);border-color:var(--muted)}
.hh .ask{font:11.5px var(--mono);padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--raise);color:var(--muted)}
.pill.gen{color:var(--comment);border-style:dashed}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.sbs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sbs .dl.half{grid-template-columns:40px 16px minmax(0,1fr)}
.sbs .dl.half+.dl.half{border-left:1px solid var(--line)}
.sbs .dl.half .cm{left:22px}
.sbs .dl.emp{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(98,114,164,.08) 6px 12px);cursor:default}
.sbs .dl.emp:hover{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(98,114,164,.08) 6px 12px)}
.thr.r{margin-left:calc(50% + 58px);max-width:calc(50% - 70px)}
.thr.l{margin-left:58px;max-width:calc(50% - 70px)}
.thr .rp.draftrp{border-left:2px dashed var(--draft);background:var(--draft-soft);padding:4px 8px;border-radius:0 4px 4px 0}
.thr .rp.draftrp .lbl{color:var(--draft);font-weight:600;letter-spacing:.06em;font-size:11px}
.thr .rbox{display:grid;gap:6px}
.disc{border-bottom:1px solid var(--line);padding-bottom:6px}
.disc .thr{margin-left:12px}
.flist .tw{color:var(--muted);font:11px var(--mono);margin-right:4px}
.flist .gsec{display:flex;justify-content:space-between;width:100%;padding:6px 12px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mrh .why{font-size:12px;color:var(--orange)}
.unread.rep{background:var(--orange)}
/* editor com LSP */
.sq{text-decoration:underline wavy var(--bad);text-underline-offset:4px;text-decoration-skip-ink:none}
.sq.w{text-decoration-color:var(--yellow)}
.lspbar{display:flex;gap:10px;align-items:center;padding:5px 12px;background:rgba(255,184,108,.10);border-bottom:1px solid var(--line);font-size:12px;color:var(--orange);flex:none}
.lspbar .mono{color:var(--fg)}
.lspbar .sp{flex:1}
.hov{position:absolute;z-index:6;max-width:440px;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font:12px/1.5 var(--sans);pointer-events:none}
.hov .sig{padding:6px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;color:var(--cyan)}
.hov p{margin:0;padding:6px 10px;border-top:1px solid var(--line);color:var(--muted)}
.hov p.e{color:var(--bad)}.hov p.wn{color:var(--yellow)}
.cmpl{position:absolute;z-index:7;min-width:240px;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font:12.5px/1.6 var(--mono);padding:3px 0;list-style:none;margin:0}
.cmpl li{display:flex;gap:10px;padding:0 10px;cursor:pointer}
.cmpl li.on{background:var(--accent-soft)}
.cmpl li .kd{color:var(--accent);width:14px}
.cmpl li .ty{margin-left:auto;color:var(--comment)}
.blame{position:absolute;z-index:3;color:var(--comment);font:12px/20px var(--sans);font-style:italic;white-space:nowrap;cursor:default;opacity:.8}
.blame:hover{opacity:1;color:var(--muted)}
.bpop{position:absolute;z-index:8;width:340px;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:6px;font-size:12.5px}
.bpop .mono{color:var(--yellow)}
.hist{flex:1;overflow:auto}
.hist button.hc{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;padding:6px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.hist button.hc:hover{background:var(--raise)}
.hist button.hc.on{background:var(--accent-soft)}
.hist .sha{font:12px var(--mono);color:var(--yellow)}
.prob{flex:1;overflow:auto}
.prob .grp{padding:8px 12px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prob button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;padding:4px 12px;align-items:baseline}
.prob button:hover{background:var(--raise)}
.prob .loc{font:11.5px var(--mono);color:var(--comment)}
.status .perr{color:var(--bad)}.status .pwarn{color:var(--yellow)}
/* lateral: multi-repo e pilha */
.feat.child{margin-left:16px}
.feat.child::before{content:"↳";position:absolute;left:-12px;top:6px;color:var(--comment);font:12px var(--mono)}
.feat .sub{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 8px;font:11px var(--mono);color:var(--muted)}
.feat .sub span::before{content:"⎇ ";color:var(--comment)}
.feat .stk{grid-column:2/4;justify-self:start;font:11px var(--mono);padding:0 6px;border-radius:3px;border:1px solid var(--orange);color:var(--orange)}
.feat .stk.mv{border-color:var(--ok);color:var(--ok)}
.warnbox{margin:8px 12px;padding:8px 10px;border:1px solid var(--orange);border-radius:6px;color:var(--orange);font:12.5px/1.5 var(--sans);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbox .mono{color:var(--fg)}
.warnbox .sp{flex:1}
.dlg .chips{display:flex;gap:6px 14px;flex-wrap:wrap}
/* perguntar ao Claude / comando por descrição */
.drawer .ctxc{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px;justify-self:start}
.drawer .sugg{display:flex;gap:6px;flex-wrap:wrap}
.drawer .qa{display:grid;gap:4px}
.drawer .qa .q{color:var(--accent);font-weight:500}
.drawer .qa .a{white-space:pre-wrap;line-height:1.55}
.drawer .qa .tl{font:12px var(--mono);color:var(--comment)}
.drawer .fin{display:flex;gap:6px;width:100%}
.drawer .fin input{flex:1;min-width:0;background:var(--win);border:1px solid var(--line);border-radius:5px;color:var(--fg);font:13px var(--sans);padding:5px 8px}
.drawer .ro{width:100%;font-size:11.5px;color:var(--comment)}
.kpop{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;width:620px;max-width:calc(100% - 28px);z-index:22;background:var(--raise);border:1px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:8px}
.kpop input{width:100%;background:var(--win);border:1px solid var(--line);border-radius:5px;color:var(--fg);font:13px var(--sans);padding:6px 8px;outline:none}
.kpop .cmd{font:13px var(--mono);background:var(--term-bg);border-radius:5px;padding:6px 10px;color:var(--ok);white-space:pre-wrap}
.kpop .hint{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
/* news */
.news{flex:1;overflow:auto}
.nitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.nitem:hover{background:rgba(68,71,90,.25)}
.nitem.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.nitem h3{margin:0;font-size:14px;font-weight:500;cursor:pointer}
.nitem .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nitem .tg{font:11px var(--mono);color:var(--comment)}
.nitem .why{grid-column:1/2;font-size:12.5px;display:flex;gap:6px 12px;flex-wrap:wrap}
.nitem .aff{color:var(--orange)}
.nitem .rel{color:var(--accent)}
.nitem .acts{grid-column:2;grid-row:1/4;align-self:center}
.nitem .sum{grid-column:1/2;margin:0;color:var(--muted);font-size:12.5px}
.brief{position:absolute;top:46px;right:14px;width:400px;max-width:calc(100% - 28px);z-index:18;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:grid}
.brief .bh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.brief .bh b{font-weight:600}.brief .bh .sp{flex:1}
.brief ol{margin:0;padding:8px 12px 8px 30px;display:grid;gap:6px;font-size:12.5px}
.brief ol .w{display:block;color:var(--muted);font-size:11.5px}
.brief .bf{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.brief .bf .sp{flex:1}
.modes button.dim{opacity:.45}
.prof{display:grid;gap:2px;padding:4px 12px 10px;font-size:12px}

/* lado a lado: cada sequência de − emparelha com a de + logo depois; contexto nos dois lados */
function sbsPairs(ls){ const out=[]; let i=0; while(i<ls.length){ if(ls[i][0]===' '){ out.push([ls[i],ls[i]]); i++; continue; }
  const d=[],a=[]; while(i<ls.length&&ls[i][0]==='-') d.push(ls[i++]); while(i<ls.length&&ls[i][0]==='+') a.push(ls[i++]);
  for(let k=0;k<Math.max(d.length,a.length);k++) out.push([d[k]||null,a[k]||null]); } return out; }

  return `<div class="dl half ${del?'del':add?'add':''} ${sel}" data-file="${f.path}" data-n="${left&&!del?n:left?'':n}" ${del?`data-o="${o}"`:''} ${left?'':`id="L-${f.path}-${n}"`}><span class="o">${num||''}</span><span class="sg">${del?'−':add?'+':''}</span><span class="cd">${hl(code)}</span>${del||!left?'<span class="cm" title="Comentar (C)">+</span>':''}</div>`;

  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[\[([^\]]+)\]\]/g,(m,n)=>wl(n));

  src.split('\n').forEach(l=>{ if(/^- /.test(l)){ if(!ul){ h+='<ul>'; ul=true; } h+=`<li>${inl(l.slice(2))}</li>`; return; } if(ul){ h+='</ul>'; ul=false; }

const PF_ITEMS=['Branch atualizada com a base','Testes afetados','Lint e typecheck','Sonar local','Nenhum segredo no diff','Nenhum arquivo proibido'];
function pfCard(f){ const pf=S.pf&&S.pf[f.id]; if(!pf) return '';
  const g={run:['⟳','var(--yellow)'],ok:['✓','var(--ok)'],fail:['✗','var(--bad)'],skip:['–','var(--muted)']};
  const rows=PF_ITEMS.map((n,i)=>{ const c=pf[i]; return `<div style="display:flex;gap:8px;text-align:left"><span style="width:12px;color:${g[c.st][1]}">${g[c.st][0]}</span><span style="display:grid;min-width:0"><span style="${c.st==='fail'?'color:var(--bad)':''}">${n}</span><span class="mono muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.d)}</span></span></div>`; }).join('');
  const done=pf.every(c=>c.st!=='run'), failed=pf.some(c=>c.st==='fail');
  return `<div class="card2" style="text-align:left;margin-top:8px"><h4>Pré-voo</h4>${rows}${done&&failed?`<div class="acts"><button class="btn pri" id="pfFix">Pedir ao Claude para corrigir</button><button class="btn" id="pfAgain">Rodar de novo</button><button class="btn danger" id="pfOver">Abrir mesmo assim</button></div><p class="muted" style="font-size:12px">O Claude recebe o comando que falhou e o fim da saída; o MR só abre quando você mandar.</p>`:''}</div>`; }
function runPf(f){ S.pf=S.pf||{}; S.pf[f.id]=PF_ITEMS.map(()=>({st:'run',d:''})); renderRight();
  const res=[['ok','em dia com origin/main'],['ok','npx vitest related --run src/slack.ts'],['fail',"npm run -s lint: src/slack.ts:2:11 'timeout' is assigned a value but never used"],['skip','nenhum arquivo que o Sonar analise'],['ok','nenhum token ou chave nas linhas novas'],['ok','sem .env, build ou node_modules']];
  res.forEach((r,i)=>setTimeout(()=>{ if(!S.pf[f.id]) return; S.pf[f.id][i]={st:r[0],d:r[1]}; renderRight(); },300+i*250)); }

function attention(){
  const q=[], go=(id,tab)=>()=>{ selectFeat(id,!tab); if(tab){ S.right=true; S.rtab=tab; renderFrame(); renderRight(); } };
  FEATS.forEach(f=>{ if(f.kind==='ws') return;
    if(f.st==='blocked') q.push({p:0,tag:'permissão',t:`${f.branch}: ${f.msg}`,run:go(f.id)});
    if(f.mr&&f.mr.pipe==='failed'&&!f.mr.merged) q.push({p:1,tag:'CI',t:`CI falhou em !${f.mr.iid} (${f.branch})`,run:go(f.id,'mr')});
    if(f.mr&&f.mr.sonar==='fail'&&!f.mr.merged) q.push({p:1,tag:'Sonar',t:`Quality gate reprovado em !${f.mr.iid}`,run:go(f.id,'mr')});
    const pc=f.mr?f.mr.comments.filter(c=>!c.sent).length:0; if(pc) q.push({p:2,tag:'MR',t:`${pc} comentário${pc>1?'s':''} novo${pc>1?'s':''} em !${f.mr.iid}`,run:go(f.id,'mr')});
    if(f.st==='done'&&f.unseen) q.push({p:2,tag:'revisar',t:`${f.branch} pronta pra revisar`,run:go(f.id,'review')});
    if(f.group&&FEATS.filter(x=>x.group===f.group).every(x=>x.st==='done')&&FEATS.find(x=>x.group===f.group)===f) q.push({p:2,tag:'comparar',t:`Tentativas de ${f.group} prontas para comparar`,run:()=>compareDlg(f)});
    if((f.ctx||0)>=80) q.push({p:3,tag:'contexto',t:`${f.branch} com ${f.ctx}% do contexto: perto de compactar`,run:go(f.id)}); });
  MRS.filter(m=>m.g==='rev'&&m.st==='new'&&!S.reviewed[m.proj+m.iid]).forEach(m=>q.push({p:3,tag:'MR alheio',t:`${m.proj} !${m.iid} de ${m.who} aguarda sua revisão`,run:()=>openMR(m)}));
  if(AU.phase==='done'&&!AU.seen) q.push({p:3,tag:'auditoria',t:'Auditoria pronta com achados para revisar',run:()=>{ AU.seen=true; setMode('audit'); }});
  DAILY.tasks.filter(t=>!t.done).forEach(t=>q.push({p:4,tag:'daily',t:t.t,run:()=>{ if(t.fid) selectFeat(t.fid); else openVault(DKEY); }}));
  return q.sort((a,b)=>a.p-b.p);
}

function fuzzy(q,s){ q=q.toLowerCase(); s=s.toLowerCase(); let j=0,sc=0,last=-2; for(let i=0;i<s.length&&j<q.length;i++){ if(s[i]===q[j]){ sc+=i===last+1?3:1; last=i; j++; } } return j===q.length?sc:-1; }
function palItems(){ const q=PAL.q.trim();
  if(PAL.mode==='att') return attention().filter(x=>!q||fuzzy(q,x.t+' '+x.tag)>=0).map(x=>({t:x.t,tag:x.tag,p:x.p,run:x.run}));
  if(PAL.mode==='repo'){ const cur=REPOS.filter(r=>r[0]===REPO), rest=REPOS.filter(r=>r[0]!==REPO);
    return [...cur,...rest,['~','só terminal']].map(([n,b])=>({t:n==='~'?'~ (só terminal, sem repo)':n+(n===REPO?' · outro trabalho no mesmo repo':''),g:n==='~'?'':b,run:()=>openWork(n,b),s:q?fuzzy(q,n+' '+b):0})).filter(x=>x.s>=0).sort((a,b)=>q?b.s-a.s:0); }
  if(PAL.mode==='db') return DBS.map((d,i)=>({t:`${d.st==='up'?'● ':'○ '}${d.n}${d.st==='up'?' · desligar':''}`,tag:/pro?d/.test(d.n)?'prd':'',p:1,g:':'+d.port,run:()=>toggleDb(i),s:q?fuzzy(q,d.n):0})).filter(x=>x.s>=0).sort((a,b)=>q?b.s-a.s:0);
  if(PAL.mode==='file') return Object.keys(F).map(p=>({t:p,g:'',run:()=>{ if(S.mode!=='feat'){ S.mode='feat'; render(); } openFile(p); },s:q?fuzzy(q,p):0})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s);
  const dbs=DBS.map((d,i)=>({t:`Banco: ${d.st==='up'?'desligar':'ligar'} ${d.n} :${d.port}`,g:'',run:()=>toggleDb(i),s:q?fuzzy(q,'banco '+d.n):-1})).filter(x=>x.s>=0)
    .concat(DBS.some(d=>d.st==='up')?[{t:'Banco: desligar todos',g:'',run:()=>{ DBS.forEach(d=>{ if(d.st==='up') d.st='off'; }); toast('Bancos desligados'); render(); },s:q?fuzzy(q,'banco desligar todos'):-1}]:[]).filter(x=>x.s>=0);
  const feats=FEATS.map((f,i)=>({t:`Feature: ${f.branch}`,g:`Ctrl+Shift+${i+1}`,run:()=>selectFeat(f.id),s:q?fuzzy(q,'feature '+f.branch):-1})).filter(x=>x.s>=0);
  return CMDS.map(([t,k,run])=>({t,g:k,run,s:q?fuzzy(q,t):0})).filter(x=>x.s>=0).concat(feats,dbs).sort((a,b)=>b.s-a.s); }
function openPal(mode,q0){

  $('#overlay').innerHTML=`<div class="scrim" id="pS"><div class="pal" role="dialog" aria-label="Paleta"><input id="pIn" placeholder="${ph}" autocomplete="off" aria-label="${ph}"><ul id="pL" role="listbox"></ul></div></div>`;

function paintPal(){ PAL.items=palItems(); const ul=$('#pL');
  ul.innerHTML=PAL.items.length?PAL.items.map((x,i)=>`<li class="${i===PAL.i?'on':''}" data-i="${i}" role="option">${x.tag?`<span class="pr pr${x.p}">${x.tag}</span>`:''}<span>${esc(x.t)}</span><span class="sp"></span>${x.g?`<kbd>${x.g}</kbd>`:''}</li>`).join(''):(PAL.mode==='att'?'<div class="none">Fila vazia. Nada esperando você.</div>':'<div class="none">Nada encontrado</div>');
  ul.querySelectorAll('li').forEach(li=>li.onclick=()=>{ PAL.i=+li.dataset.i; runPal(); }); const on=ul.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'}); }
function runPal(){ const x=PAL.items[PAL.i]; closeOverlay(); if(x) x.run(); }

function toast(msg,action){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){ const b=document.createElement('button'); b.textContent=action.label; b.onclick=()=>{ action.run(); t.remove(); }; t.appendChild(b); }
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),action?6000:2800); }
function sendSel(){
  let ref=null; const ta=$('#code');
  if(S.mode==='feat'&&S.right&&S.rtab==='file'&&ta){ const a=ta.value.slice(0,ta.selectionStart).split('\n').length, b=ta.value.slice(0,ta.selectionEnd).split('\n').length; ref=`@${S.file}:${a===b?a:a+'-'+b}`; }
  else if(S.sel) ref=`@${S.sel.file}:${S.sel.n}`;
  if(!ref){ toast('Selecione linhas no editor ou no diff'); return; }
  if(S.mode!=='feat'){ S.mode='feat'; render(); }
  const f=feat(); if(f.kind==='ws'){ toast('Este terminal não tem Claude; escolha uma feature'); return; }
  if(f.tab!==0&&!f.split){ f.tab=0; } else if(f.split) f.tab=0; renderCenter();
  const i=document.querySelector('.tin-in[data-t="0"]'); i.value=(i.value?i.value+' ':'')+ref+' '; i.focus();
}

/* ---------- teclado: Ctrl+tecla é do terminal; Ctrl+Shift+tecla é do Maestro (igual ao Ghostty) ---------- */
document.addEventListener('keydown',e=>{
  const k=e.key, ctrl=e.ctrlKey||e.metaKey, inField=!!(e.target.matches&&e.target.matches('input,textarea,select'))||e.target.isContentEditable;
  const inTerm=!!(e.target.classList&&e.target.classList.contains('tin-in'));
  if(k==='Escape'){
    if(TOUR){ endTour(); return; }
    if(OV){ e.preventDefault(); closeOverlay(); return; }
    if(S.prefix){ S.prefix=false; renderCenter(); return; }
    if(CMPL){ closeCompl(); return; }
    if(ASK){ closeAsk(); return; }
    if(S.replying){ S.replying=null; rerender(); return; }
    if(S.editing){ cancelEdit(S.editing); return; }
    if(RV&&RV.phase!=='run'){ closeDrawer(); return; }
    if(S.mascot&&!S.mascot.leaving){ dismissMascot(); return; }
    if(inTerm){ const f=feat(); if(f.tabs[+e.target.dataset.t].k==='claude'){ if(f.st==='blocked'){ answer(f,3); return; } interrupt(f); } return; }
    if(S.mode==='mr'){ setMode('mrs'); return; }
    if(inField) e.target.blur(); return;
  }
  if(OV&&OV.type==='pal'){ if(k==='ArrowDown'){ e.preventDefault(); PAL.i=Math.min(PAL.i+1,PAL.items.length-1); paintPal(); } else if(k==='ArrowUp'){ e.preventDefault(); PAL.i=Math.max(PAL.i-1,0); paintPal(); } else if(k==='Enter'){ e.preventDefault(); runPal(); } return; }
  if(OV&&OV.type==='dlg'){ if(ctrl&&k==='Enter'){ e.preventDefault(); OV.ok(); } return; }
  if(OV) return;
  if(ctrl&&e.shiftKey&&e.altKey&&(k==='ArrowLeft'||k==='ArrowRight')&&e.target.id==='code'){ e.preventDefault(); wordSel(e.target,k==='ArrowRight'); return; }
  if(e.altKey&&!ctrl&&/^Digit[1-6]$/.test(e.code)){ e.preventDefault(); [()=>setMode('feat'),()=>setMode('mrs'),()=>setMode('db'),()=>openVault(),openNews,()=>openPal('att')][+e.code.slice(5)-1](); return; }
  if(!ctrl&&!e.altKey&&!e.shiftKey&&!inField&&e.key==='s'&&S.mode==='mr'){ e.preventDefault(); S.layout=S.layout==='split'?'unified':'split'; rerender(); return; }
  if(ctrl&&e.shiftKey){
    const c=e.code, f=feat(), act={
      KeyP:()=>openPal('cmd'), KeyO:()=>openPal('file'), KeyE:()=>{ if(S.mode!=='feat'){ S.mode='feat'; S.right=true; render(); } else toggleRight(); },
      KeyB:()=>{ S.left=!S.left; renderFrame(); }, KeyL:sendSel, KeyN:newFeatureDlg, Space:nextAttention,
      Enter:()=>S.mode==='feat'&&herdr(f,'-'), Backslash:()=>S.mode==='feat'&&herdr(f,'v'), KeyZ:()=>S.mode==='feat'&&herdr(f,'z'), KeyT:()=>S.mode==='feat'&&herdr(f,'c'),
      ArrowLeft:()=>{ if(S.mode!=='feat') return; if(e.target.closest&&e.target.closest('#right')){ focusTerm(); return; } herdr(f,'ArrowLeft'); },
      ArrowRight:()=>{ if(S.mode!=='feat') return; if(e.target.closest&&e.target.closest('#right')) return; if(f.split&&f.tab===0){ herdr(f,'ArrowRight'); return; } if(S.right) focusEditor(); else toast('Não há pane à direita. Ctrl+Shift+E abre o editor.'); },
      ArrowUp:()=>herdr(f,'ArrowUp'), ArrowDown:()=>herdr(f,'ArrowDown'), KeyK:openKcmd, KeyD:()=>openPal('db'),
    }[c];
    if(c.startsWith('Arrow')&&inField&&!inTerm&&!(e.target.closest&&e.target.closest('#right')&&(c==='ArrowLeft'||c==='ArrowRight'))) return;
    const dg=/^Digit([1-9])$/.exec(c);
    if(dg){ const x=FEATS[+dg[1]-1]; if(x){ e.preventDefault(); selectFeat(x.id); } return; }
    if(act){ e.preventDefault(); act(); return; }
  }
  if(e.altKey&&k.toLowerCase()==='n'){ e.preventDefault(); newFeatureDlg(); return; }
  if(e.altKey&&!ctrl&&k.toLowerCase()==='t'){ e.preventDefault(); openPal('repo'); return; }
  if(e.altKey&&!ctrl&&k.toLowerCase()==='w'){ e.preventDefault(); closeWork(WI); return; }
  if(e.altKey&&!ctrl&&(k===']'||k==='[')){ e.preventDefault(); goWork((WI+(k===']'?1:-1)+WORKS.length)%WORKS.length); return; }
  if(inTerm) return;
  if(ctrl&&!e.shiftKey&&k==='p'){ e.preventDefault(); openPal('file'); return; }
  if(ctrl&&k==='k'){ e.preventDefault(); openPal('cmd'); return; }
  if(ctrl&&k==='Enter'){
    if(S.editing&&e.target.id==='dt-'+S.editing){ e.preventDefault(); saveDraft(S.editing); return; }
    if(S.replying&&e.target.id==='rp-'+S.replying){ e.preventDefault(); addReply(S.replying); return; }
    if(S.mode==='mr'){ e.preventDefault(); askPublish(); return; }
    if(S.mode==='feat'&&S.right){ e.preventDefault(); sendToClaude(); return; }
  }
  if(ctrl&&k==='s'){ e.preventDefault(); save(); return; }
  if(inField) return;
  if(ctrl&&k==='z'){ e.preventDefault(); undo(); return; }
  if(ctrl||e.altKey) return;
  if(k==='?'){ if(S.sel&&(S.mode==='mr'||(S.mode==='feat'&&S.right&&S.rtab==='review'))){ askFromSel(); return; } openHelp(); return; }
  if(RV&&RV.phase==='setup'&&k==='Enter'){ e.preventDefault(); runReview(); return; }
  if(k==='R'&&e.shiftKey&&S.mode!=='feat'){ startReview(); return; }
  if(S.mode==='db'){ const xs=dbVis();
    if(k==='j'||k==='ArrowDown'){ e.preventDefault(); S.dbsel=Math.min((S.dbsel||0)+1,xs.length-1); renderCenter(); }
    else if(k==='k'||k==='ArrowUp'){ e.preventDefault(); S.dbsel=Math.max((S.dbsel||0)-1,0); renderCenter(); }
    else if(k==='Enter'&&xs[S.dbsel||0]) toggleDb(xs[S.dbsel||0].i);
    else if(k==='/'){ e.preventDefault(); $('#dbq').focus(); }
    return; }
  if(S.mode==='mrs'){ const rows=inboxRows();
    if(k==='j'||k==='ArrowDown'){ e.preventDefault(); S.isel=Math.min(S.isel+1,rows.length-1); renderCenter(); }
    else if(k==='k'||k==='ArrowUp'){ e.preventDefault(); S.isel=Math.max(S.isel-1,0); renderCenter(); }
    else if(k==='Enter') openMR(rows[S.isel]);
    else if(k==='o'&&rows[S.isel]) openGitlab(rows[S.isel]);
    else if(k==='/'){ e.preventDefault(); $('#iq').focus(); }
    return; }
  if((k==='c'||k==='C')&&(S.mode==='mr'||(S.mode==='feat'&&S.right&&S.rtab==='review'))){ e.preventDefault(); newDraft(); return; }
  if(S.mode==='mr'&&S.mr&&S.mr.iid===124){ if(k==='n'){ e.preventDefault(); stepFile(1); return; } if(k==='p'){ e.preventDefault(); stepFile(-1); return; }
    if(k==='v'){ e.preventDefault(); toggleViewed(S.curFile||D_MR.find(f=>!S.viewed.has(f.path))?.path||D_MR[0].path,true); return; } }
  if(S.mode==='mr'&&k==='o'){ e.preventDefault(); openGitlab(S.mr); return; }
  if(S.mode==='mr'&&k==='r'){ e.preventDefault(); refreshMR(S.mr); return; }
  if(S.mode==='feat'&&k.length===1&&!(e.target.closest&&e.target.closest('#right'))){ focusTerm(); }
});
$('#mVault').onclick=()=>openVault(); $('#mFeat').onclick=()=>setMode('feat'); $('#mMrs').onclick=()=>setMode('mrs'); $('#mNews').onclick=openNews; $('#mDb').onclick=()=>setMode('db');
$('#qBtn').onclick=()=>openPal('att'); $('#hFile').onclick=()=>openPal('file'); $('#hCmd').onclick=()=>openPal('cmd'); $('#hHelp').onclick=()=>openHelp();
if(innerWidth<760){ S.left=false; }

const scenario=()=>{ const f=feat('slack'); if(f&&f.st==='blocked'&&!(S.mode==='feat'&&S.fid==='slack')){ f.unseen=true; if(!S.mq.find(x=>x.fid==='slack')) S.mq.push({fid:'slack',kind:'ask'}); if(!S.mascot) nextMascot(); renderLeft(); } };
if(tour('feat')) S.afterTour=()=>{ setTimeout(openBrief,300); setTimeout(scenario,800); }; else { setTimeout(openBrief,600); setTimeout(scenario,1500); }
setTimeout(()=>simNotify(),8000);

run(H,[[4000,'dot','⏺ Update(src/app.ts)','Escrevendo'],[600,'out','  ⎿  Updated src/app.ts with 2 additions'],[1500,'dot','⏺ Bash(npm test)','Testando'],[1800,'out','  ⎿  Tests: 14 passed, 14 total'],
  [800,'dotw','⏺ Pronto: GET /health responde 200 com o banco ok e 503 sem ele.']],()=>setSt(H,'done','pronto pra revisar'));
$('#rzL').onmousedown=e=>startResize(e,'L'); $('#rzR').onmousedown=e=>startResize(e,'R');
